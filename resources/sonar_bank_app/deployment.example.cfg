# =============================================================================
# SONAR Bank App — deployment.example.cfg
# =============================================================================
# Copy the relevant lines into server.cfg for a clean QBCore staging deployment.
# Do not commit real production secrets.
# =============================================================================

# Resource order
ensure oxmysql
ensure qb-core
ensure sonar_bridges
ensure sonar_core
ensure sonar_bank
ensure sonar_bank_app

# Required hardening convars
set sonar_bank_atm_hmac_secret "REPLACE_WITH_64_HEX_CHAR_SECRET"
set sonar_status_transition_whitelist "sonar_bank,sonar_bank_app,sonar_core"
set sonar_bank_watchdog_compromise_ratio_threshold "0.1"
set sonar_bank_watchdog_min_sample_size "10"
set sonar_bank_audit_query_per_citizen_per_min "1"
set sonar_bank_audit_query_global_per_min "10"
set sv_maxRateLimitResetGraceSeconds "300"
set sonar_dev_mode "0"

# ACE baseline
add_ace group.admin sonar.bank.admin allow
add_ace group.admin sonar.bank.player allow

# Government/GRC staging groups
add_ace group.govt sonar.bank.player allow
add_ace group.govt sonar.bank.govt.audit.full allow
add_ace group.govt_compliance sonar.bank.player allow
add_ace group.govt_compliance sonar.bank.govt.audit.full allow
add_ace group.govt_compliance sonar.bank.govt.compliance.admin allow
add_ace group.govt_tax sonar.bank.player allow
add_ace group.govt_tax sonar.bank.govt.audit.full allow
add_ace group.govt_tax sonar.bank.govt.tax.write allow

# Business staging pattern; replace <company_uuid> per company treasury.
# add_ace identifier.license:xxxxxxxx sonar.bank.empresas.<company_uuid> allow
# add_ace identifier.license:xxxxxxxx sonar.bank.business.payroll.<company_uuid> allow
# add_ace identifier.license:xxxxxxxx sonar.bank.business.approval.<company_uuid> allow

# QBCore integration notes
# Config.Commands.OPEN_BANK.name: bank
# Config.Commands.OPEN_BANK.key_mapping.default_key: F6
# Config.Items.BANK_CARD: sonar_bank_card
# Config.Items.ATM_ACCESS_CARD: sonar_bank_atm_card
# Usable bank card should trigger client event: sonar:bank:client:open or sonar:bank:client:toggle
# Close event for external integrations: sonar:bank:client:close
