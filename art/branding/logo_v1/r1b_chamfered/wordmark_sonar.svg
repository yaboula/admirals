    A: x=268, y=16
    R: x=352, y=16

  Anti-pattern check:
     NO concentric waves
     NO submarine silhouette
     NO bevel / drop-shadow / emboss
     NO holographic gradient
     Chunky chamfered slab  geometric precision + atemporal industrial signature
-->
