<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&amp;display=swap');</style>
    <mask id="lockup-h-stencil">
      <rect width="100%" height="100%" fill="white"/>
      <!-- Stencil cuts on SONAR (text starts at x=250, font-size 44, letter-spacing 0.05em) -->
      <!-- O letter — vertical cuts top/bottom -->
      <rect x="324" y="54" width="4" height="12" fill="black"/>
      <rect x="324" y="84" width="4" height="12" fill="black"/>
      <!-- A letter — horizontal bar gap -->
      <rect x="414" y="73" width="10" height="4" fill="black"/>
      <!-- R letter — loop gap -->
      <rect x="478" y="62" width="8" height="4" fill="black"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="600" height="150" fill="#000000" rx="15"/>

  <!-- Isotipo — paths re-centered around (180, 75) — canvas vertical center -->
  <g transform="translate(180, 75)">
    <g transform="translate(-129, -136)">
      <path d="M124 108 Q158 108 158 132 Q158 156 124 156" fill="none" stroke="#FF5100" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
      <path d="M124 122 Q148 122 148 136 Q148 150 124 150" fill="none" stroke="#FF5100" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
      <path d="M100 136 Q110 122 124 122 Q138 122 138 136 Q138 150 124 150 Q108 150 100 164" fill="none" stroke="#FF5100" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Vertical separator -->
  <line x1="225" y1="50" x2="225" y2="100" stroke="#FF5100" stroke-width="2" opacity="0.5"/>

  <!-- SONAR wordmark — vertically centered (dominant-baseline central, y=75) -->
  <text x="250" y="75" dominant-baseline="central" text-anchor="start"
        fill="#FAFAFA" mask="url(#lockup-h-stencil)"
        style="font-family: 'Syncopate', sans-serif; font-weight:700; font-size:44px; letter-spacing: 0.05em;">SONAR</text>
</svg>
