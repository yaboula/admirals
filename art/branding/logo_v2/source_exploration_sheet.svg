  y removidas de este archivo para clarity.

  ACLARACIÓN CANONICAL (founder):
    - Concept A es preferencia VISUAL por forma arc-based sobre letter-based.
    - NO es un pivote de identidad de marca. Metáfora, voz, paleta, tipografía
