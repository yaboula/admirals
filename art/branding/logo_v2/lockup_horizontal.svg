<?xml version="1.0" encoding="UTF-8"?>
<!--
  SONAR Lockup HORIZONTAL — concept A monogram + SONAR wordmark
  Composition: monogram left, wordmark right, gap 0.5× monogram height
  Monogram native 256×256, scaled 0.625 → 160 tall. Gap 80. Wordmark text 72pt.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200"
     role="img" aria-label="SONAR — lockup horizontal">
  <title>SONAR — lockup horizontal (concept A)</title>
  <rect x="0" y="0" width="640" height="200" fill="#03070A"/>

  <!-- Monogram concept A scaled 0.625 (160×160 in lockup), positioned left -->
  <g transform="translate(20 20) scale(0.625)" fill="none" stroke="#2DD4BF"
     stroke-width="13.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 113 44 Q 215 44 215 116 Q 215 188 113 188" opacity="0.35"/>
    <path d="M 113 86 Q 185 86 185 128 Q 185 170 113 170" opacity="0.65"/>
    <path d="M 41 128 Q 71 86 113 86 Q 155 86 155 128 Q 155 170 113 170 Q 65 170 41 212" opacity="1"/>
  </g>

  <!-- Wordmark SONAR, baseline aligned to monogram center, gap 80 from monogram right edge -->
  <text x="260" y="120" text-anchor="start"
        font-family="'Geist', 'Geist Sans', 'Inter Tight', Inter, system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="600" letter-spacing="-0.035em"
        fill="#F0F4F4">SONAR</text>
</svg>
