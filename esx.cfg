# =============================================================================
#  SONAR — esx.cfg (ESX 1.10+ Framework Configuration)
#
#  Configuration for ST-022 multi-framework matrix testing on ESX 1.10+
#  DO NOT commit this file — contains secrets and environment-specific config
# =============================================================================

# -----------------------------------------------------------------------------
# Endpoints
# -----------------------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# -----------------------------------------------------------------------------
# Server identity
# -----------------------------------------------------------------------------
sv_hostname "SONAR — ESX 1.10+ Test Server"

# Your FiveM Keymaster license key — https://keymaster.fivem.net/
sv_licenseKey "cfxk_1I7wFnz9xQYPAGasGqhkV_1kacjN"

sv_maxclients 48

# Disable script hook (recommended for production)
sv_scriptHookAllowed 0

# -----------------------------------------------------------------------------
# Database — oxmysql connection string
# -----------------------------------------------------------------------------
# SONAR DB convars (SONAR usa DB 'sonar')
set mysql_connection_string "mysql://root@127.0.0.1:3306/sonar?charset=utf8mb4"
set sonar_db_host     "localhost"
set sonar_db_user     "root"
set sonar_db_password "YOUR_DB_PASSWORD"
set sonar_db_database "sonar"

# ESX DB convars (ESX usa DB 'esx')
set esx_mysql_connection_string "mysql://root@127.0.0.1:3306/esx?charset=utf8mb4"

# -----------------------------------------------------------------------------
# SONAR environment
# -----------------------------------------------------------------------------
setr sonar_env "development"
set sonar_dev_mode "1"

# -----------------------------------------------------------------------------
# SONAR Bridges — Force ESX adapters for ST-022
# -----------------------------------------------------------------------------
setr sonar_bridge_bank      "esx"
setr sonar_bridge_identity  "esx"
setr sonar_bridge_bank_mode "standalone"

# -----------------------------------------------------------------------------
# Resources — ESX 1.10+ Framework
# -----------------------------------------------------------------------------

# --- Core dependencies -------------------------------------------------------
ensure oxmysql
ensure ox_lib
ensure ox_inventory

# --- Framework (ESX 1.10+) --------------------------------------------------
setr esx_multicharacter_enabled "0"
ensure es_extended
ensure esx_identity
ensure esx_skin

# --- SONAR (always last) ----------------------------------------------------
ensure sonar_bridges
ensure sonar_core
ensure sonar_bank
ensure sonar_bank_app

# -----------------------------------------------------------------------------
# ST-022 Test Convars
# -----------------------------------------------------------------------------
# Watchdog convars from C-SEC-02 R1 hardening
set sonar_status_transition_whitelist "sonar_bank,sonar_core,sonar_bridges"
set sonar_bank_watchdog_compromise_ratio_threshold "0.10"
set sonar_bank_watchdog_min_sample_size "50"
set sonar_bank_atm_hmac_secret "a7b3c9d2e4f6a8b1c3d5e7f9a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2"

# Rate limit convars from C-SEC-02 findings
set sv_maxRateLimitResetGraceSeconds "300"
set sonar_bank_audit_query_per_citizen_per_min "1"
set sonar_bank_audit_query_global_per_min "10"
